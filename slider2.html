<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before After Slider</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f3f3f3;
      font-family: sans-serif;
    }

    .slider-wrap {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 12px;
      background: #ddd;
      user-select: none;
    }

    .slider-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .before-image {
      z-index: 2;
      clip-path: inset(0 50% 0 0);
    }

    .after-image {
      z-index: 1;
    }

    .divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #3b82f6;
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
    }

    .handle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      background: #3b82f6;
      transform: translate(-50%, -50%);
      z-index: 4;
      pointer-events: none;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      line-height: 1;
    }

    .range {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: ew-resize;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="slider-wrap">
    <!-- 下の画像 -->
    <img
      class="slider-image after-image"
      src="https://s.mina-toku.jp/slider/images/202604081134596737_2.jpg"
      alt="After"
    >

    <!-- 上の画像 -->
    <img
      class="slider-image before-image"
      id="beforeImage"
      src="https://s.mina-toku.jp/slider/images/202604081134596737_1.jpg"
      alt="Before"
    >

    <div class="divider" id="divider"></div>
    <div class="handle" id="handle">◀▶</div>

    <input
      id="range"
      class="range"
      type="range"
      min="0"
      max="100"
      value="50"
    >
  </div>

  <script>
    const range = document.getElementById('range');
    const beforeImage = document.getElementById('beforeImage');
    const divider = document.getElementById('divider');
    const handle = document.getElementById('handle');

    function updateSlider(value) {
      const v = Number(value);
      beforeImage.style.clipPath = `inset(0 ${100 - v}% 0 0)`;
      divider.style.left = v + '%';
      handle.style.left = v + '%';
    }

    range.addEventListener('input', (e) => {
      updateSlider(e.target.value);
    });

    updateSlider(range.value);
  </script>

</body>
</html>
